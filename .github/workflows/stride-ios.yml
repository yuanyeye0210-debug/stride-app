name: build-stride-ipa

# 版本规则：每次构建 = 一个新版本（1.1.<run_number>）
#   旧仓库最后发过 stride-v1.0.10，所以这里从 1.1 起，保证手机能看到更新。
#   1. 先跑单元测试，失败就不编译、不发版
#   2. 编译 → Stride-1.1.N.ipa
#   3. 发布到 Releases（tag: stride-v1.1.N）
#   4. 按版本号数字排序，只保留最新 2 个（当前 + 上一版），更早的连同 tag 一起删
#   5. 用剩下的两个 release 更新仓库根目录的 apps.json（SideStore / AltStore 源）
#
# 触发条件：只有 ios 或这条工作流变了才跑。改文档、改 Web 不会产生新版本。
# pull request 只测试和编译，不发布。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/stride-ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/stride-ios.yml'

permissions:
  contents: write

env:
  KEEP_RELEASES: 2

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version
        id: v
        run: |
          N='${{ github.run_number }}'
          echo "marketing=1.1.$N" >> "$GITHUB_OUTPUT"
          echo "build=$N" >> "$GITHUB_OUTPUT"
          echo "tag=stride-v1.1.$N" >> "$GITHUB_OUTPUT"
          echo "版本：1.1.$N"

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Test
        run: |
          set -o pipefail
          DEST='platform=iOS Simulator,name=iPhone 16'
          if ! xcodebuild -project Stride.xcodeproj -scheme Stride -showdestinations 2>/dev/null | grep -q 'name:iPhone 16'; then
            NAME=$(xcrun simctl list devices available | sed -n 's/^[[:space:]]*\(iPhone [^()]*\).*/\1/p' | head -1 | sed 's/[[:space:]]*$//')
            if [ -z "$NAME" ]; then
              echo "没有可用的 iPhone 模拟器"
              xcrun simctl list devices available
              exit 1
            fi
            DEST="platform=iOS Simulator,name=${NAME}"
          fi
          echo "测试设备：$DEST"
          xcodebuild test \
            -project Stride.xcodeproj \
            -scheme Stride \
            -destination "$DEST" \
            -only-testing:StrideTests

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Stride.xcodeproj \
            -scheme Stride \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="${{ steps.v.outputs.marketing }}" \
            CURRENT_PROJECT_VERSION="${{ steps.v.outputs.build }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            ENABLE_BITCODE=NO \
            build

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/Stride.app"
          test -d "$APP" || { echo "找不到 $APP"; ls -R build/Build/Products | head -60; exit 1; }
          rm -rf Payload Stride-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr Stride-unsigned.ipa Payload
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp Stride-unsigned.ipa "$GITHUB_WORKSPACE/dist/Stride-${{ steps.v.outputs.marketing }}.ipa"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
            "Payload/Stride.app/Info.plist" || true
          ls -lh "$GITHUB_WORKSPACE/dist"

      - name: Publish release
        if: github.event_name != 'pull_request'
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG='${{ steps.v.outputs.tag }}'
          VER='${{ steps.v.outputs.marketing }}'
          IPA="$GITHUB_WORKSPACE/dist/Stride-$VER.ipa"
          NOTES=$(cat <<EOF
          自动构建 #${{ github.run_number }} · ${{ github.sha }}

          未签名 IPA。在 iPhone 上安装 SideStore，并打开 LocalDevVPN：
          1. SideStore → 源 → 添加 https://raw.githubusercontent.com/${{ github.repository }}/main/apps.json
          2. 安装「步迹」。SideStore 会用你的 Apple ID 签名。
          3. 保持 LocalDevVPN 连接。免费证书到期前在 SideStore 里刷新即可，不用重装，本机记录还在。

          源和 Releases 都只保留当前版和上一版。
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release 已存在（同一 run 重跑），覆盖产物"
            gh release upload "$TAG" "$IPA" --clobber
          else
            gh release create "$TAG" "$IPA" \
              --title "Stride $VER" \
              --notes "$NOTES"
          fi

      - name: Prune old releases
        if: github.event_name != 'pull_request'
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KEEP="${KEEP_RELEASES:-2}"
          echo "保留版本数：$KEEP"
          TAGS=$(gh release list --limit 100 --json tagName \
            --jq '[.[] | select(.tagName | startswith("stride-v"))
                    | { tag: .tagName,
                        v: (.tagName | sub("stride-v"; "") | split(".") | map(tonumber)) }]
                  | sort_by(.v) | reverse | .[].tag')
          echo "按版本号从新到旧："
          echo "$TAGS"
          i=0
          while IFS= read -r t; do
            [ -z "$t" ] && continue
            i=$((i+1))
            if [ "$i" -gt "$KEEP" ]; then
              echo "删除旧版本：$t"
              gh release delete "$t" --yes --cleanup-tag || echo "  删除失败（忽略）"
            fi
          done <<< "$TAGS"
          echo '--- 清理后 ---'
          gh release list --limit 100 --json tagName \
            --jq '[.[] | select(.tagName | startswith("stride-v"))
                    | { tag: .tagName,
                        v: (.tagName | sub("stride-v"; "") | split(".") | map(tonumber)) }]
                  | sort_by(.v) | reverse | .[].tag'

      - name: Update SideStore source
        if: github.event_name != 'pull_request'
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOCAL_IPA: ${{ github.workspace }}/dist/Stride-${{ steps.v.outputs.marketing }}.ipa
          LOCAL_VERSION: ${{ steps.v.outputs.marketing }}
        run: |
          python3 .github/scripts/sidestore_source.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json
          if git diff --cached --quiet; then
            echo "SideStore 源没有变化"
          else
            git commit -m "更新 SideStore 源"
            git push
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stride-ipa-${{ steps.v.outputs.marketing }}
          path: dist/Stride-${{ steps.v.outputs.marketing }}.ipa
          retention-days: 7
          if-no-files-found: error
