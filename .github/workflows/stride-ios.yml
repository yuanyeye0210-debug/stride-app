name: build-stride-ipa

# Sideloadly 未签名 IPA 自动构建与发布工作流
# 版本规则：每次构建 = 一个新版本（1.1.<run_number>）
#   旧仓库最后发过 stride-v1.0.10，所以这里从 1.1 起，保证覆盖升级时版本号递增。
#   1. 先跑单元测试（StrideTests），失败就不编译、不发版
#   2. 编译未签名应用并打包 → Stride-1.1.N.ipa（供 Sideloadly 电脑端签名安装）
#   3. 校验 Bundle ID（com.yg.stride）并计算文件大小与 SHA-256
#   4. 发布到 GitHub Releases（tag: stride-v1.1.N），附带 Sideloadly 安装说明
#   5. 按版本号数字排序，只保留最新 2 个 Release（当前版 + 上一版），更早的连同 tag 一起删除
#
# 触发条件：只有 ios 或这条工作流变了才跑。改文档、改 Web 不会产生新版本。
# pull request 只测试和编译，不发布。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/stride-ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/stride-ios.yml'

permissions:
  contents: write

env:
  KEEP_RELEASES: 2

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version
        id: v
        run: |
          N='${{ github.run_number }}'
          echo "marketing=1.1.$N" >> "$GITHUB_OUTPUT"
          echo "build=$N" >> "$GITHUB_OUTPUT"
          echo "tag=stride-v1.1.$N" >> "$GITHUB_OUTPUT"
          echo "版本：1.1.$N"

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Test
        run: |
          set -o pipefail
          DEST='platform=iOS Simulator,name=iPhone 16'
          if ! xcodebuild -project Stride.xcodeproj -scheme Stride -showdestinations 2>/dev/null | grep -q 'name:iPhone 16'; then
            NAME=$(xcrun simctl list devices available | sed -n 's/^[[:space:]]*\(iPhone [^()]*\).*/\1/p' | head -1 | sed 's/[[:space:]]*$//')
            if [ -z "$NAME" ]; then
              echo "没有可用的 iPhone 模拟器"
              xcrun simctl list devices available
              exit 1
            fi
            DEST="platform=iOS Simulator,name=${NAME}"
          fi
          echo "测试设备：$DEST"
          xcodebuild test \
            -project Stride.xcodeproj \
            -scheme Stride \
            -destination "$DEST" \
            -only-testing:StrideTests

      - name: Inject Gemini API Key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            cat > Stride/AI/BuiltInAISecrets.swift <<EOF
          import Foundation

          enum BuiltInAISecrets {
              static let geminiAPIKey = "$GEMINI_API_KEY"
          }
          EOF
            echo "已注入内置 Gemini API Key（长度：${#GEMINI_API_KEY}）"
          else
            echo "未设置 GEMINI_API_KEY Secret，保留空占位"
          fi

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Stride.xcodeproj \
            -scheme Stride \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="${{ steps.v.outputs.marketing }}" \
            CURRENT_PROJECT_VERSION="${{ steps.v.outputs.build }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            ENABLE_BITCODE=NO \
            build

      - name: Package IPA for Sideloadly
        id: pkg
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/Stride.app"
          test -d "$APP" || { echo "找不到 $APP"; ls -R build/Build/Products | head -60; exit 1; }

          rm -rf Payload Stride-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          rm -rf Payload/Stride.app/_CodeSignature
          zip -qry Stride-unsigned.ipa Payload

          mkdir -p "$GITHUB_WORKSPACE/dist"
          OUT="$GITHUB_WORKSPACE/dist/Stride-${{ steps.v.outputs.marketing }}.ipa"
          cp Stride-unsigned.ipa "$OUT"

          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "Payload/Stride.app/Info.plist")
          SHORT_VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "Payload/Stride.app/Info.plist")
          BUILD_VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "Payload/Stride.app/Info.plist")
          MIN_OS=$(/usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "Payload/Stride.app/Info.plist" || echo "17.0")
          test "$BUNDLE_ID" = "com.yg.stride" || { echo "Bundle ID 异常：$BUNDLE_ID"; exit 1; }

          SHA256=$(shasum -a 256 "$OUT" | awk '{print $1}')
          SIZE_BYTES=$(stat -f%z "$OUT")
          SIZE_MB=$(awk -v b="$SIZE_BYTES" 'BEGIN { printf "%.2f MB", b / 1048576 }')

          echo "bundle_id=$BUNDLE_ID" >> "$GITHUB_OUTPUT"
          echo "min_os=$MIN_OS" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$SIZE_BYTES" >> "$GITHUB_OUTPUT"
          echo "size_human=$SIZE_MB" >> "$GITHUB_OUTPUT"

          echo "Bundle ID: $BUNDLE_ID"
          echo "Version: $SHORT_VER ($BUILD_VER), iOS $MIN_OS+"
          echo "Size: $SIZE_MB ($SIZE_BYTES bytes)"
          echo "SHA-256: $SHA256"
          ls -lh "$GITHUB_WORKSPACE/dist"

      - name: Publish release
        if: github.event_name != 'pull_request'
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG='${{ steps.v.outputs.tag }}'
          VER='${{ steps.v.outputs.marketing }}'
          IPA="$GITHUB_WORKSPACE/dist/Stride-$VER.ipa"
          NOTES=$(cat <<EOF
          自动构建 #${{ github.run_number }} · ${{ github.sha }}

          ### 产物信息（Sideloadly 未签名 IPA）
          - 文件：\`Stride-$VER.ipa\`
          - Bundle ID：\`${{ steps.pkg.outputs.bundle_id }}\`
          - 最低系统：iOS ${{ steps.pkg.outputs.min_os }}+
          - 大小：${{ steps.pkg.outputs.size_human }}（${{ steps.pkg.outputs.size_bytes }} bytes）
          - SHA-256：\`${{ steps.pkg.outputs.sha256 }}\`

          ### 使用 Sideloadly 安装到 iPhone
          1. 下载下方附件 \`Stride-$VER.ipa\` 到电脑（Windows / macOS）。
          2. 用数据线连接 iPhone，在电脑打开 [Sideloadly](https://sideloadly.io/)（iOS 16+ 需在手机「设置 → 隐私与安全性 → 开发者模式」中开启开发者模式）。
          3. 将 \`Stride-$VER.ipa\` 拖入 Sideloadly，填入你的 Apple ID（不要修改 Bundle ID，保持 \`com.yg.stride\`），点击 **Start** 签名安装。
          4. 首次安装后，在 iPhone「设置 → 通用 → VPN 与设备管理」信任你的 Apple ID 即可打开「步迹」。
          5. 后续升级或 7 天证书续签：用同一 Apple ID 覆盖安装新版 IPA（或在 Sideloadly 中开启 Wi-Fi 自动续签），本机训练与饮食记录均完整保留。

          Releases 仅保留当前版与上一版（共 ${KEEP_RELEASES:-2} 个版本），方便按需回退。
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release 已存在（同一 run 重跑），覆盖产物并更新说明"
            gh release upload "$TAG" "$IPA" --clobber
            gh release edit "$TAG" --title "Stride $VER" --notes "$NOTES"
          else
            gh release create "$TAG" "$IPA" \
              --title "Stride $VER" \
              --notes "$NOTES"
          fi

      - name: Prune old releases
        if: github.event_name != 'pull_request'
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KEEP="${KEEP_RELEASES:-2}"
          echo "保留版本数：$KEEP"
          TAGS=$(gh release list --limit 100 --json tagName \
            --jq '[.[] | select(.tagName | startswith("stride-v"))
                    | { tag: .tagName,
                        v: (.tagName | sub("stride-v"; "") | split(".") | map(tonumber)) }]
                  | sort_by(.v) | reverse | .[].tag')
          echo "按版本号从新到旧："
          echo "$TAGS"
          i=0
          while IFS= read -r t; do
            [ -z "$t" ] && continue
            i=$((i+1))
            if [ "$i" -gt "$KEEP" ]; then
              echo "删除旧版本：$t"
              gh release delete "$t" --yes --cleanup-tag || echo "  删除失败（忽略）"
            fi
          done <<< "$TAGS"
          echo '--- 清理后 ---'
          gh release list --limit 100 --json tagName \
            --jq '[.[] | select(.tagName | startswith("stride-v"))
                    | { tag: .tagName,
                        v: (.tagName | sub("stride-v"; "") | split(".") | map(tonumber)) }]
                  | sort_by(.v) | reverse | .[].tag'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stride-ipa-${{ steps.v.outputs.marketing }}
          path: dist/Stride-${{ steps.v.outputs.marketing }}.ipa
          retention-days: 7
          if-no-files-found: error
