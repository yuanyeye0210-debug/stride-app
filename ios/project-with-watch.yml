# 含 Apple Watch 端（StrideWatch）的完整 XcodeGen 配置（需付费 Apple 开发者账号或 Xcode 真机调试时使用）
name: Stride
options:
  bundleIdPrefix: com.yg
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Stride:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Stride
    dependencies:
      - target: StrideWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yg.stride
        PRODUCT_NAME: Stride
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSMotionUsageDescription: "用于读取耳机空间姿态与手表/手机运动传感器，实现低头护颈提醒、头控手势及动作自动计次（数据仅在本机处理）。"
        INFOPLIST_KEY_NSHealthShareUsageDescription: "读取步数、活动能量、心率与体重，用于今日概览和训练负荷判断。"
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "把完成的训练写入 Apple 健康，保持你的运动记录完整。"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
  StrideWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: StrideWatch
      - path: Stride/Health/WatchMotionEngine.swift
      - path: Stride/Resources/watch_exercise_classifier_v1.json
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yg.stride.watchkitapp
        PRODUCT_NAME: StrideWatch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.yg.stride
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: false
        INFOPLIST_KEY_NSMotionUsageDescription: "采集手腕 6 轴运动传感器数据，端侧识别健身动作并自动计次。"
        INFOPLIST_KEY_NSHealthShareUsageDescription: "开启力量训练后台传感器保活会话。"
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "记录力量训练动作识别会话。"
        CODE_SIGN_STYLE: Automatic
  StrideTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: StrideTests
    dependencies:
      - target: Stride
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yg.stride.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Stride.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Stride"
        BUNDLE_LOADER: "$(TEST_HOST)"
